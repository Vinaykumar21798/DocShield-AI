services:
  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      APP_NAME: DocShield-AI
      APP_VERSION: 1.0.0
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/pii_phi_document_intelligence_poc
      REDIS_URL: redis://redis:6379/0
      PROCESSING_JOB_MAX_RETRIES: 3
      PADDLEOCR_LAYOUT_ANALYSIS_ENABLED: "True"
      BYPASS_LLM: "True"
      OLLAMA_REQUIRED: "False"
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_REQUIRED_MODELS: qwen3:4b
      GLINER_ALLOW_MODEL_DOWNLOAD: "True"
      HF_HOME: /root/.cache/huggingface
      DETECTION_HIGH_CONFIDENCE_THRESHOLD: "0.80"
      DETECTION_MEDIUM_CONFIDENCE_THRESHOLD: "0.60"
      DETECTION_STOPPING_CANDIDATE_THRESHOLD: "0"
      DETECTION_MIN_CANDIDATE_CHARS: "3"
      UPLOAD_DIR: storage/uploads
      MAX_FILE_SIZE_MB: 100
      STARTUP_VALIDATION_ENABLED: "True"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: DocShield-AI
      APP_VERSION: 1.0.0
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/pii_phi_document_intelligence_poc
      REDIS_URL: redis://redis:6379/0
      PROCESSING_JOB_MAX_RETRIES: 3
      PADDLEOCR_LAYOUT_ANALYSIS_ENABLED: "True"
      BYPASS_LLM: "True"
      OLLAMA_REQUIRED: "False"
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_REQUIRED_MODELS: qwen3:4b
      GLINER_ALLOW_MODEL_DOWNLOAD: "True"
      HF_HOME: /root/.cache/huggingface
      DETECTION_HIGH_CONFIDENCE_THRESHOLD: "0.80"
      DETECTION_MEDIUM_CONFIDENCE_THRESHOLD: "0.60"
      DETECTION_STOPPING_CANDIDATE_THRESHOLD: "0"
      DETECTION_MIN_CANDIDATE_CHARS: "3"
      UPLOAD_DIR: storage/uploads
      MAX_FILE_SIZE_MB: 100
      STARTUP_VALIDATION_ENABLED: "True"
    ports:
      - "8001:8000"
    volumes:
      - app_storage:/app/storage
      - paddle_models:/root/.paddlex
      - hf_models:/root/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "redis_queue/worker.py"]
    environment:
      APP_NAME: DocShield-AI
      APP_VERSION: 1.0.0
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/pii_phi_document_intelligence_poc
      REDIS_URL: redis://redis:6379/0
      PROCESSING_JOB_MAX_RETRIES: 3
      PADDLEOCR_LAYOUT_ANALYSIS_ENABLED: "True"
      BYPASS_LLM: "False"
      OLLAMA_REQUIRED: "True"
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_REQUIRED_MODELS: qwen3:4b
      GLINER_ALLOW_MODEL_DOWNLOAD: "True"
      HF_HOME: /root/.cache/huggingface
      DETECTION_HIGH_CONFIDENCE_THRESHOLD: "0.80"
      DETECTION_MEDIUM_CONFIDENCE_THRESHOLD: "0.60"
      DETECTION_STOPPING_CANDIDATE_THRESHOLD: "0"
      DETECTION_MIN_CANDIDATE_CHARS: "3"
      UPLOAD_DIR: storage/uploads
      MAX_FILE_SIZE_MB: 100
      STARTUP_VALIDATION_ENABLED: "True"
    volumes:
      - app_storage:/app/storage
      - paddle_models:/root/.paddlex
      - hf_models:/root/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pii_phi_document_intelligence_poc
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pii_phi_document_intelligence_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  app_storage:
  paddle_models:
  hf_models:
