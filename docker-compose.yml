services:
  migrate:
    build: .
    container_name: docshield-migrate
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      APP_NAME: DocShield-AI
      APP_VERSION: 1.0.0
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/pii_phi_document_intelligence_poc
      REDIS_URL: redis://redis:6379/0
      PROCESSING_JOB_MAX_RETRIES: 3
      PADDLEOCR_LAYOUT_ANALYSIS_ENABLED: "True"
      BYPASS_LLM: "True"
      OLLAMA_REQUIRED: "False"
      UPLOAD_DIR: storage/uploads
      MAX_FILE_SIZE_MB: 100
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: docshield-api
    restart: unless-stopped
    environment:
      APP_NAME: DocShield-AI
      APP_VERSION: 1.0.0
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/pii_phi_document_intelligence_poc
      REDIS_URL: redis://redis:6379/0
      PROCESSING_JOB_MAX_RETRIES: 3
      PADDLEOCR_LAYOUT_ANALYSIS_ENABLED: "True"
      BYPASS_LLM: "True"
      OLLAMA_REQUIRED: "False"
      UPLOAD_DIR: storage/uploads
      MAX_FILE_SIZE_MB: 100
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: docshield-worker
    restart: unless-stopped
    command: ["python", "redis_queue/worker.py"]
    environment:
      APP_NAME: DocShield-AI
      APP_VERSION: 1.0.0
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/pii_phi_document_intelligence_poc
      REDIS_URL: redis://redis:6379/0
      PROCESSING_JOB_MAX_RETRIES: 3
      PADDLEOCR_LAYOUT_ANALYSIS_ENABLED: "True"
      BYPASS_LLM: "True"
      OLLAMA_REQUIRED: "False"
      UPLOAD_DIR: storage/uploads
      MAX_FILE_SIZE_MB: 100
    volumes:
      - app_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: datafactz-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pii_phi_document_intelligence_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pii_phi_document_intelligence_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: datafactz-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  app_storage: